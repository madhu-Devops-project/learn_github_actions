name: Flask CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Flask
        run: |
          python -c "import flask; print(flask.__version__)"

      - name: Build Docker Image
        run: |
          docker build -t flask-cicd-app .

      - name: Tag Docker Image
        run: |
          docker tag flask-cicd-app ${{ vars.DOCKER_USERNAME }}/flask-cicd-app:latest
          docker tag flask-cicd-app ${{ vars.DOCKER_USERNAME }}/flask-cicd-app:${{ github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Latest Image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/flask-cicd-app:latest

      - name: Push Commit Image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/flask-cicd-app:${{ github.sha }}
