name : Deploy to VM

on:
  push:
    branches:
      - main
jobs:

  deploy app in VM:

    runs-on: ubuntu-latest

  steps:

    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.2.0

      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}

        script: |

          docker pull ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest

          docker stop flask-app || true

          docker rm flask-app || true

          docker run -d \
            --name flask-app \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/flask-cicd-app:latest
